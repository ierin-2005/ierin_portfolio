<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ipm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#ipm-grad)" stroke-width="2" stroke-opacity="0.8" />
  <!-- Monogram IPM -->
  <text x="32" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="url(#ipm-grad)" text-anchor="middle" letter-spacing="1">IPM</text>
  <!-- Subtle accent dot -->
  <circle cx="50" cy="20" r="3" fill="#00f2fe" />
</svg>
