<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="1000" cy="200" r="350" fill="url(#glow)" filter="blur(60px)" />
  <circle cx="200" cy="500" r="250" fill="url(#glow)" filter="blur(50px)" />

  <!-- Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Badge Top -->
  <g transform="translate(80, 80)">
    <rect width="260" height="42" rx="21" fill="#111a2e" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="22" cy="21" r="5" fill="#14b8a6" />
    <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#22d3ee" letter-spacing="1">AI &amp; MACHINE LEARNING</text>
  </g>

  <!-- Monogram Logo Top Right -->
  <g transform="translate(1040, 80)">
    <rect width="70" height="70" rx="18" fill="#111a2e" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="35" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="url(#brand)" text-anchor="middle">IPM</text>
  </g>

  <!-- Title & Headline -->
  <text x="80" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">Ierin P Menachery</text>
  <text x="80" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="url(#brand)">Building Intelligent Solutions for Real-World Problems</text>

  <!-- Description paragraph -->
  <text x="80" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Computer Science Undergraduate · LLMs &amp; RAG · Larsen &amp; Toubro (L&amp;T) AI/ML Intern</text>
  <text x="80" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Creator of HydroGPT — Hydrology &amp; Flood AI Question-Answering System</text>

  <!-- Highlights Pill Row -->
  <g transform="translate(80, 440)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="320" height="60" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">AI/ML Intern @ L&amp;T</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(340, 0)">
      <rect width="320" height="60" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">HydroGPT RAG System</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(680, 0)">
      <rect width="340" height="60" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">B.Tech CS · Kerala, India</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <text x="80" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#64748b">ierinmenachery@gmail.com  •  Developer Portfolio  •  GitHub Pages</text>
</svg>
